# Picked up automatically by `docker compose up` in development.
# CI and production use `docker compose -f docker-compose.yml ...` to ignore it.
services:
  api:
    build:
      target: build
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    command: ['npm', 'run', 'start:dev', '--workspace', '@wanderly/api']
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
    ports:
      - '3000:3000'
      - '9229:9229' # node inspector
