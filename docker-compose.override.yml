# Picked up automatically by `docker compose up` in development.
# CI and production use `docker compose -f docker-compose.yml ...` to ignore it.
services:
  api:
    build:
      target: build
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    # Not `npm run start:dev`: that loads the host's .env, which does not exist
    # in the container (compose supplies the environment instead), and node's
    # --watch crashes trying to watch a missing env file.
    working_dir: /app/apps/api
    command: ['node', '--watch', '-r', 'ts-node/register', 'src/main.ts']
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
    ports:
      - '3000:3000'
      - '9229:9229' # node inspector
