name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    # Real Postgres, not a mock: the tests assert behaviour of the database
    # itself (unique constraints, row locks, citext). Global setup creates a
    # scratch database and applies the migrations, so this also proves they
    # apply cleanly to an empty schema.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wanderly
          POSTGRES_PASSWORD: wanderly
          POSTGRES_DB: wanderly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wanderly -d wanderly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://wanderly:wanderly@localhost:5432/wanderly_test

  docker:
    runs-on: ubuntu-latest
    needs: [verify, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: APP=api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
